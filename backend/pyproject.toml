[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI's Depends() in defaults
  "E501",  # the formatter wraps code; long string literals (email wording, messages) are fine
]
per-file-ignores = { "tests/*" = ["E501"], "app/data/*" = ["E501"], "alembic/versions/*" = ["E501"] }
